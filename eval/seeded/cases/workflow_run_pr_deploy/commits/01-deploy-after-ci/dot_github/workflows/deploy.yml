name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: ./scripts/deploy.sh production
