[project]
name = "preflight-review"
version = "1.0.2"
description = "Local pre-push AI code reviewer that writes a report for agents to work on."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
]

[project.urls]
Homepage = "https://github.com/AdinathChaudhari/preflight-review"
Repository = "https://github.com/AdinathChaudhari/preflight-review"

[project.scripts]
preflight-review = "preflight_review.cli:main"
preflight = "preflight_review.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preflight_review"]
include = [
  "src/preflight_review/**/*.py",
  "src/preflight_review/prompts/*.md",
  "src/preflight_review/model/schemas/*.json",
  "src/preflight_review/hooks/*.sh",
  "src/preflight_review/ast_rules/**/*.yml",
  "src/preflight_review/ast_rules/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
